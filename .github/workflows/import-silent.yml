name: Inspect silent Canvas build data
on:
  push:
    paths:
      - "tools/silent_inspect.py"
      - ".github/workflows/import-silent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled game source
        shell: bash
        run: python3 tools/silent_inspect.py
