name: Build silent Canvas edition
on:
  push:
    paths:
      - "tools/silent_build.py"
      - "docs/silent/app.js"
      - "docs/silent/index.html"
      - ".github/workflows/import-silent.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check docs/silent/app.js
      - name: Install image tools
        run: python3 -m pip install --break-system-packages pillow
      - name: Build graphics and event data
        run: python3 tools/silent_build.py
      - name: Install browser test dependency
        run: python3 -m pip install --break-system-packages selenium
      - name: Test GPU-disabled Chrome browser game
        shell: bash
        run: |
          python3 -m http.server 8766 --directory docs >/tmp/server.log 2>&1 &
          sleep 2
          python3 tools/silent_browser_test.py
      - name: Check output
        shell: bash
        run: |
          du -sh docs/silent
          find docs/silent -type f | wc -l
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/silent/data.json').read_text())
          print('Map count',len(d['maps']))
          print('Game start:',d['db']['System']['start_map_id'],d['db']['System']['start_x'],d['db']['System']['start_y'])
          print('Map003 event triggers:',[(e['id'],[p['trigger'] for p in e['pages']]) for e in d['maps']['3']['events'].values()])
          print('Sprites',len(d['sprites']))
          print('Audio asset count',len(list(Path('docs/silent').rglob('*.ogg'))))
          assert len(d['maps'])==13
          assert any(p['trigger']==3 for e in d['maps']['3']['events'].values() for p in e['pages'])
          PY

      - name: Publish silent edition into main/docs for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("docs")
          previous=root/"index.html"
          legacy=root/"legacy.html"
          if not legacy.exists():
              legacy.write_text(previous.read_text(encoding="utf-8"),encoding="utf-8")
          home='''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./silent/">
          <title>楽しい冒険を始まる — 無音版</title>
          <script>location.replace("./silent/");</script>
          </head><body style="background:#121c2c;color:#f4ead8;font-family:system-ui;text-align:center;margin:15vh auto">
          <h1>楽しい冒険を始まる</h1>
          <p><a style="color:#fbe0a1" href="./silent/">無音版で冒険を始める</a></p>
          <p><a style="color:#acbddb" href="./legacy.html">従来のWebGL版</a></p>
          </body></html>'''
          previous.write_text(home,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/legacy.html docs/silent
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish silent WebGL-free Canvas RPG on GitHub Pages"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "GitHub Pages entry: https://anonymous51398747310968.github.io/tanoshi-boken-browser/"
